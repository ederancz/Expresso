# Unified query configuration (receptors + excitability)
# Single source of truth for both gene panels. Edit genes/regions/levels here.
#
# gene_panel is nested two levels: category -> family -> [gene symbols].
#   categories: receptors (neuromodulatory) and excitability (intrinsic ion channels)
# The 'family' drives per-family heatmaps; 'category' is available for grouping
# and is recorded in the synthesis evidence table. load_config also accepts a
# flat panel (family -> [genes]) and the legacy keys receptors/excitability.
#
# Use official mouse gene symbols. Receptor list curated 07 Jul 2026; excitability
# panel curated 07 Jul 2026 (see excitability_genes.md for mechanism + references).

gene_panel:
  receptors:
    glutamate:
      # - Grin1    # from here NMDA_ionotropic
      # - Grin2a
      # - Grin2b
      # - Grin2c
      # - Grin2d
      # - Grin3a
      # - Grin3b
      # - Gria1    # from here AMPA_ionotropic
      # - Gria2
      # - Gria3
      # - Gria4
      # - Grik1    # from here kainate_ionotropic
      # - Grik2
      # - Grik3
      # - Grik4
      # - Grik5
      - Grm1     # from here metabotropic (Group I)
      - Grm5
      - Grm2     # from here metabotropic (Group II)
      - Grm3
      - Grm4     # from here metabotropic (Group III)
      - Grm6
      - Grm7
      - Grm8

    gaba:
      # - Gabra1   # from here GABAA_ionotropic
      # - Gabra2
      # - Gabra3
      # - Gabra4
      # - Gabra5
      # - Gabra6
      # - Gabrb1
      # - Gabrb2
      # - Gabrb3
      # - Gabrg1
      # - Gabrg2
      # - Gabrg3
      # - Gabrd
      # - Gabre
      # - Gabrp
      # - Gabrq
      # - Gabrr1
      # - Gabrr2
      # - Gabrr3
      - Gabbr1   # from here GABAB_metabotropic
      - Gabbr2

    glycine:
      - Glra1    # from here ionotropic (GlyR); primary expression brainstem/spinal cord; Glra2/Glrb detectable in cortex/thalamus
      - Glra2
      - Glra3
      - Glra4
      - Glrb

    dopamine:
      - Drd1     # from here D1-like (Gs-coupled)
      - Drd5
      - Drd2     # from here D2-like (Gi-coupled)
      - Drd3
      - Drd4

    serotonin:
      - Htr1a    # from here 5-HT1 family (Gi-coupled)
      - Htr1b
      - Htr1d
      - Htr1f
      - Htr2a    # from here 5-HT2 family (Gq-coupled)
      - Htr2b
      - Htr2c
      - Htr3a    # from here 5-HT3 (ionotropic, ligand-gated cation channel)
      - Htr3b
      - Htr4     # from here 5-HT4/5/6/7 (Gs or Gi-coupled)
      - Htr5a
      - Htr5b
      - Htr6
      - Htr7

    noradrenaline:
      - Adra1a   # from here alpha-1 (Gq-coupled)
      - Adra1b
      - Adra1d
      - Adra2a   # from here alpha-2 (Gi-coupled); Adra2a dominant presynaptic autoreceptor in cortex
      - Adra2b
      - Adra2c
      - Adrb1    # from here beta (Gs-coupled)
      - Adrb2
      - Adrb3

    acetylcholine:
      - Chrm1    # from here muscarinic (GPCRs); Chrm1 dominant in cortex
      - Chrm2
      - Chrm3
      - Chrm4
      - Chrm5
      - Chrna2   # from here neuronal nicotinic (ionotropic); alpha subunits
      - Chrna3
      - Chrna4
      - Chrna5
      - Chrna6
      - Chrna7
      - Chrna9
      - Chrna10
      - Chrnb2   # from here neuronal nicotinic beta subunits
      - Chrnb3
      - Chrnb4
      - Chrna1   # from here muscle-type nicotinic subunits (negligible CNS expression)
      - Chrnb1
      - Chrng
      - Chrnd
      - Chrne

    histamine:
      - Hrh1     # GPCR; Hrh1/Hrh2 postsynaptic; Hrh3 presynaptic autoreceptor
      - Hrh2
      - Hrh3
      - Hrh4

    adenosine:
      - Adora1   # from here P1 receptors (GPCRs); Adora1 and Adora2a dominant in CNS
      - Adora2a
      - Adora2b
      - Adora3

    cannabinoid:
      - Cnr1     # GPCR; high expression in cortex and thalamus
      - Cnr2     # low neuronal expression; mainly immune/microglia in CNS

    purinergic_P2X:
      - P2rx1    # from here ionotropic P2X (ligand-gated cation channels); P2rx4/P2rx7 most relevant CNS
      - P2rx2
      - P2rx3
      - P2rx4
      - P2rx5
      - P2rx6
      - P2rx7

    purinergic_P2Y:
      - P2ry1    # from here metabotropic P2Y (GPCRs); P2rx11 has no rodent ortholog
      - P2ry2
      - P2ry4
      - P2ry6
      - P2ry12   # dominant microglial receptor
      - P2ry13
      - P2ry14

    opioid:
      - Oprm1    # mu; GPCR (Gi-coupled)
      - Oprd1    # delta
      - Oprk1    # kappa
      - Oprl1    # nociceptin/ORL1

    neuropeptide_Y:
      - Npy1r    # from here NPY/PYY/PP receptors (GPCRs)
      - Npy2r
      - Npy4r
      - Npy5r
      - Npy6r    # low/restricted CNS expression

    somatostatin:
      - Sstr1    # from here somatostatin receptors (GPCRs); Sstr2 most abundant in cortex/thalamus
      - Sstr2
      - Sstr3
      - Sstr4
      - Sstr5

    CRF:
      - Crhr1    # from here CRF/urocortin receptors (GPCRs)
      - Crhr2

    orexin_hypocretin:
      - Hcrtr1   # from here orexin receptors (GPCRs)
      - Hcrtr2

    VIP_PACAP:
      - Vipr1    # VPAC1; binds VIP and PACAP equally (GPCR)
      - Vipr2    # VPAC2; binds VIP and PACAP equally
      - Adcyap1r1 # PAC1; selective for PACAP

    tachykinin:
      - Tacr1    # NK1 receptor; primary receptor for substance P (GPCR)
      - Tacr2    # NK2
      - Tacr3    # NK3; primary receptor for neurokinin B

    galanin:
      - Galr1    # from here galanin receptors (GPCRs)
      - Galr2
      - Galr3

    neurotensin:
      - Ntsr1    # high-affinity; GPCR
      - Ntsr2    # low-affinity

    oxytocin_vasopressin:
      - Oxtr     # oxytocin receptor (GPCR)
      - Avpr1a   # from here vasopressin receptors (GPCRs); Avpr1a widespread CNS
      - Avpr1b   # mainly pituitary and hippocampus
      - Avpr2    # mainly kidney; low CNS

    melanocortin:
      - Mc1r     # from here melanocortin receptors (GPCRs); Mc3r/Mc4r principal CNS receptors
      - Mc2r     # ACTH receptor; mainly adrenal
      - Mc3r
      - Mc4r
      - Mc5r

    cholecystokinin:
      - Cckar    # CCK-A (GPCR)
      - Cckbr    # CCK-B; dominant in brain cortex

    calcitonin_CGRP:
      - Calcr    # calcitonin receptor (GPCR); also amylin receptor component
      - Calcrl   # calcitonin receptor-like receptor; forms CGRP/adrenomedullin receptors with RAMPs
      - Ramp1    # from here RAMPs (single-TM chaperones that define CALCRL pharmacology)
      - Ramp2
      - Ramp3

    bombesin:
      - Nmbr     # neuromedin B receptor (GPCR)
      - Grpr     # gastrin-releasing peptide receptor
      - Brs3     # bombesin receptor subtype 3; orphan-like, hypothalamus enriched

    neuropeptide_S:
      - Npsr1    # neuropeptide S receptor (GPCR); expressed in cortex/thalamus/amygdala

    neuropeptide_FF:
      - Npffr1   # from here NPFF receptors (GPCRs); pain modulation and opioid interaction
      - Npffr2

    neuropeptide_B_W:
      - Npbwr1   # from here neuropeptides B/W receptors (GPCRs)
      - Npbwr2

    neuromedin_U:
      - Nmur1    # from here neuromedin U receptors (GPCRs)
      - Nmur2

    ghrelin:
      - Ghsr     # growth hormone secretagogue receptor (GPCR); ghrelin receptor; expressed in cortex/hypothalamus

    melatonin:
      - Mtnr1a   # from here melatonin receptors (GPCRs); Mtnr1a high in SCN/thalamus
      - Mtnr1b

  excitability:

    # === FAMILY 1: primary membrane conductances (pore-forming alpha subunits) ===

    voltage_gated_sodium:
      - Scn2a    # PROMINENT. Nav1.2; proximal AIS + dendrites; backpropagation, INaP
      - Scn8a    # Nav1.6; distal AIS; AP threshold, persistent + resurgent Na current
      - Scn1a    # from here PLAUSIBLE. Nav1.1; lower in pyramids, some dendritic role
      - Scn3a    # Nav1.3; mainly developmental, can drive INaP

    voltage_gated_potassium:
      - Kcnq2    # PROMINENT. Kv7.2; M-current with Kcnq3; threshold accommodation, resonance
      - Kcnq3    # Kv7.3; obligate M-current partner; AIS-enriched
      - Kcnq5    # Kv7.5; contributes to neuronal M-current
      - Kcna1    # Kv1.1; AIS/axonal; D-type current, threshold, first-spike latency
      - Kcna2    # Kv1.2; AIS/axonal; D-type current, dampens excitability
      - Kcnb1    # Kv2.1; somatic delayed rectifier; high-frequency firing, Vm clustering
      - Kcnd2    # Kv4.2; dominant somatodendritic A-type; dendritic bAP, integration
      - Kcna4    # from here PLAUSIBLE. Kv1.4; A-type current in pyramidal dendrites
      - Kcnb2    # Kv2.2; delayed rectifier, minor relative to Kv2.1
      - Kcnd3    # Kv4.3; A-type current, secondary to Kv4.2 in cortex
      - Kcnc1    # Kv3.1; fast repolarisation; lower in pyramids than fast-spikers
      - Kcnf1    # Kv5.1; modulatory (silent) subunit of delayed rectifiers
      - Kcng1    # Kv6.1; modulatory subunit, heteromerises with Kv2
      - Kcns3    # Kv9.3; modulatory subunit of Kv2 channels
      - Kcnh1    # Kv10.1 (eag1); slow K current, weak pyramidal evidence
      - Kcnh7    # Kv11.3 (erg3); subthreshold/spike-frequency regulation

    voltage_gated_calcium:
      - Cacna1c  # PROMINENT. Cav1.2; somatodendritic L-type; plateau potentials, Ca signalling
      - Cacna1e  # Cav2.3; R-type; dendritic Ca spikes, couples to SK in NMDA spikes
      - Cacna1g  # Cav3.1; T-type LVA; rebound burst, subthreshold Ca, low-threshold spike
      - Cacna1i  # Cav3.3; T-type LVA; slow subthreshold Ca, resonance contribution
      - Cacna1d  # from here PLAUSIBLE. Cav1.3; L-type, lower-threshold, pacemaking-type
      - Cacna1a  # Cav2.1; P/Q-type, dendritic Ca influx (mainly presynaptic)
      - Cacna1b  # Cav2.2; N-type, dendritic Ca influx, couples to BK (mainly presynaptic)
      - Cacna1h  # Cav3.2; T-type LVA, dendritic low-threshold Ca

    hcn_pacemaker:
      - Hcn1     # PROMINENT. HCN1; fast Ih; dominant dendritic resonance/sag, apical gradient
      - Hcn2     # HCN2; slower cAMP-sensitive Ih; co-assembles with HCN1
      - Hcn3     # from here PLAUSIBLE. HCN3; minor neuronal contribution
      - Hcn4     # HCN4; slowest Ih, low cortical pyramidal expression

    calcium_activated_potassium:
      - Kcnma1   # PROMINENT. BK (Slo1); fast Ca/voltage-gated; AP repol, fast AHP, dendritic damping
      - Kcnn2    # SK2; apamin-sensitive; medium AHP, dendritic Ca-spike & NMDA-spike tuning
      - Kcnn1    # SK1; medium AHP contribution
      - Kcnn3    # SK3; medium AHP contribution
      - Kcnt1    # from here PLAUSIBLE. Slack (KNa1.1); Na-activated K, slow AHP/adaptation
      - Kcnt2    # Slick (KNa1.2); Na-activated K, adaptation
      - Kcnu1    # BK-related (Slo3), weak CNS evidence

    inward_rectifier_and_leak:
      - Kcnj2    # PROMINENT. Kir2.1; classical inward rectifier; resting potential, input resistance
      - Kcnj3    # Kir3.1 (GIRK1); G-protein-gated, neuromodulatory hyperpolarisation
      - Kcnj6    # Kir3.2 (GIRK2); dominant neuronal GIRK pore subunit
      - Kcnk2    # TREK-1 (K2P); background leak, mechano/lipid-sensitive, sets RMP
      - Kcnj4    # from here PLAUSIBLE. Kir2.3; inward rectifier, secondary
      - Kcnj9    # Kir3.3 (GIRK3); GIRK heteromer component
      - Kcnk1    # TWIK-1; background leak
      - Kcnk3    # TASK-1; pH-sensitive leak, RMP
      - Kcnk9    # TASK-3; pH-sensitive leak, RMP
      - Kcnk10   # TREK-2; background leak

    # === FAMILY 2: auxiliary / modulatory subunits (non-pore-forming) ===
    # Shape kinetics, trafficking, voltage-dependence of Family 1. Easy to drop.

    sodium_aux:
      - Scn1b    # PROMINENT. Navbeta1; gating, trafficking, modulates INaP/resurgent
      - Scn2b    # from here PLAUSIBLE. Navbeta2; trafficking, surface expression
      - Scn3b    # Navbeta3; gating modulation
      - Scn4b    # Navbeta4; implicated in resurgent Na current
      - Fgf12    # iFGF (FHF1); intracellular Nav modulator, slows inactivation
      - Fgf13    # iFGF (FHF2); intracellular Nav modulator, dendritic excitability
      - Fgf14    # iFGF (FHF4); AIS Nav modulator, firing/excitability

    potassium_aux:
      - Kcnip2   # PROMINENT. KChIP2; Kv4.2 partner; A-current density/kinetics, gradient
      - Dpp6     # DPPX; Kv4.2 partner; A-current voltage-dependence, recovery
      - Kcnip1   # from here PLAUSIBLE. KChIP1; Kv4 modulation
      - Kcnip3   # KChIP3/calsenilin; Kv4 modulation, Ca-sensing
      - Kcnip4   # KChIP4; Kv4 modulation
      - Dpp10    # DPP10; Kv4 partner, faster inactivation
      - Kcnab1   # Kvbeta1; confers inactivation on Kv1 channels
      - Kcnab2   # Kvbeta2; Kv1 trafficking/kinetics
      - Kcne1    # MinK; modulates Kv7/KCNQ kinetics
      - Kcne2    # MiRP1; modulates Kv7 and others

    calcium_aux:
      - Cacnb3   # PROMINENT. Cavbeta3; HVA Ca-channel trafficking/gating
      - Cacna2d1 # Cav alpha2delta-1; HVA Ca trafficking, current density
      - Cacnb1   # from here PLAUSIBLE. Cavbeta1; HVA Ca auxiliary
      - Cacnb2   # Cavbeta2; HVA Ca auxiliary
      - Cacnb4   # Cavbeta4; HVA Ca auxiliary
      - Cacna2d2 # alpha2delta-2; HVA Ca trafficking
      - Cacna2d3 # alpha2delta-3; HVA Ca trafficking
      - Cacng2   # stargazin/TARP gamma-2; Ca-channel + AMPA modulation
      - Cacng8   # TARP gamma-8; mainly AMPA trafficking, listed for completeness

    hcn_aux:
      - Pex5l    # PLAUSIBLE. TRIP8b; HCN dendritic trafficking & cAMP gating

    bk_aux:
      - Kcnmb2   # PLAUSIBLE. BKbeta2; inactivating BK, kinetics
      - Kcnmb4   # BKbeta4; BK gating/pharmacology, dendritic spines
      - Kcnmb1   # BKbeta1; Ca-sensitivity modulation (low neuronal)

    # === FAMILY 3: Ca2+ handling & homeostasis (indirect: gate KCa & dendritic events) ===
    # Maximalist inclusion; not membrane conductances. Drop first if scope tightens.

    calcium_handling:
      - Ryr2     # PROMINENT. ryanodine receptor 2; CICR, dendritic Ca amplification, plateaus
      - Itpr1    # IP3 receptor 1; ER Ca release, dendritic Ca signalling
      - Atp2b2   # PMCA2; plasma-membrane Ca extrusion, shapes transients
      - Atp2a2   # SERCA2; ER Ca reuptake, sets transient time course
      - Ryr1     # from here PLAUSIBLE. RyR1; CICR, lower neuronal expression
      - Ryr3     # RyR3; CICR, dendritic
      - Itpr2    # IP3R2; ER Ca release (more glial)
      - Itpr3    # IP3R3; ER Ca release, minor neuronal
      - Atp2b1   # PMCA1; Ca extrusion
      - Slc8a1   # NCX1; Na/Ca exchanger, shapes recovery & plateaus
      - Slc8a2   # NCX2; Na/Ca exchanger
      - Atp2b3   # PMCA3; fast Ca extrusion

    calcium_buffers:
      - Calb1    # PLAUSIBLE. calbindin-D28k; mobile Ca buffer, dendritic Ca spread
      - Calb2    # calretinin; mobile Ca buffer (sparse in pyramids)
      - Calm1    # calmodulin 1; Ca sensor for channels (Cav, SK, etc.)
      - Calm2    # calmodulin 2
      - Calm3    # calmodulin 3
      - Hpca     # hippocalcin; neuronal Ca sensor, links to sAHP/Kv4


# -------------------------------------------------------------------
# Brain areas
# Use CCF v3 acronyms (Allen Mouse Brain Atlas parcellation).
# Full names are in: https://alleninstitute.github.io/abc_atlas_access/docs/parcellation_annotations/
# -------------------------------------------------------------------
# brain_areas:
#   - CTX      # Isocortex (all cortical areas)
  # - STR      # Striatum
  # - PAL      # Pallidum
  # - TH       # Thalamus
  # - HY       # Hypothalamus
  # - MB       # Midbrain
  # - HIP      # Hippocampal formation
  # - AMY      # Amygdala
  # - CB       # Cerebellum
  # - MY       # Medulla

# Optionally narrow to sub-regions (comment out brain_areas above and use these instead):
brain_areas:
  - VISp    # Primary visual cortex
  - VISpm
  - VISam
  - RSPagl
  # presynaptic input areas (check Allen nomenclature) 
  # - ACAv
  # - ORBvm
  # - LP
  # - ATh
  # - RSPg
#   - MOs     # Secondary motor cortex
#   - CP      # Caudate-putamen
#   - ACB     # Nucleus accumbens
#   - CA1     # Hippocampus CA1
#   - DG      # Dentate gyrus

# -------------------------------------------------------------------
# Cell type resolution
# Choose the level of the Allen taxonomy hierarchy to group by.
# Options: class | subclass | supertype | cluster
#
# Class (~34): neurotransmitter type + broad origin (glutamatergic, GABAergic, non-neuronal) — too coarse for any projection-specific question.
# Subclass (~338): layer + projection identity first appear here (L2/3 IT CTX, L5 ET CTX, Pvalb, Sst…) but lumps the same cell type across all cortical areas.
# Supertype (~1,201): subclass split into partially area-resolved groups — the level your config uses, balancing statistical power against granularity.
# Cluster (~5,322): maximally fine, often area-specific leaf nodes, but cell counts per area get small for lowly expressed genes.

# -------------------------------------------------------------------
cell_type_level: supertype

# Optional loose filter: keep cell types whose name contains any substring below.
# Use [] or omit to include all types at cell_type_level.
cell_type_name_filter:
  - "L2/3"
  - "L5"

# -------------------------------------------------------------------
# Functional landscape analysis (M5 extension)
# Rows: cell_type × brain_area (set cell_type_level to supertype in notebooks 01–04).
# Expression: high/medium tier only; spatial datasets preferred (see expression_priority).
# Ephys grouping: VISp vs V2M (VISpm + VISam + RSPagl treated as visual, not "RSP").
# -------------------------------------------------------------------
functional_analysis:
  # Functional clustering needs dense module scores; supertype is recommended
  # (subclass + high/medium tier alone often yields 0 clusterable targets).
  cell_type_level: supertype
  min_score_completeness: 0.5   # fraction of modules non-NaN per target for clustering/PCA
  expression_priority:
    - allen_merfish   # region-resolved; measured when available, imputed for excitability
    - vizgen
    - zhuang
    - allen_scrna     # broadcast fallback when spatial absent
  min_module_genes: 2
  min_targets_for_cluster: 5
  clustering_method: ward
  embedding_method: pca          # pca | umap (needs umap-learn)
  vis_groups:
    VISp: [VISp]
    V2M: [VISpm, VISam, RSPagl]
  # Synthetic rollup targets appended to evidence + reports (V2M, V2M_wt).
  region_rollup_methods: #TODO explore other methods
    - unweighted_mean          # → brain_area V2M (matches ephys brain_area_group) 
    - cell_count_weighted      # → brain_area V2M_wt (sensitivity)
  experimental_resonance_csv: data/test_experimental_resonance.csv  # one row per ephys cell
  functional_modules:
    # --- subthreshold resonance (excitability_genes.md) ---
    subthreshold_resonance_core:
      category: excitability
      description: H- + M-resonance core + INaP amplifier
      genes: [Hcn1, Hcn2, Kcnq2, Kcnq3, Kcnq5, Scn2a, Scn8a]
    h_resonance_axis:
      category: excitability
      description: I_h / H-resonance (~1–5 Hz)
      genes: [Hcn1, Hcn2, Pex5l]
    m_resonance_axis:
      category: excitability
      description: I_M / M-resonance (theta band near threshold)
      genes: [Kcnq2, Kcnq3, Kcnq5]
    resonance_amplifier:
      category: excitability
      description: Persistent Na+ sharpens resonance peak
      genes: [Scn2a, Scn8a, Fgf12, Fgf13, Fgf14]
    subthreshold_counterbalance:
      category: excitability
      description: A-current, Kir2, leak oppose resonance
      genes: [Kcnd2, Kcnip2, Kcnj2, Kcnk2]
    # --- neuromodulator coupling (receptor_excitability.md) ---
    gi_girk_axis:
      category: receptors
      coupling: Gi/Go
      description: GIRK, ↓cAMP, presynaptic Cav inhibition
      genes: [Adra2a, Adra2c, Htr1a, Htr1b, Htr1f, Gabbr1, Gabbr2, Drd2, Drd3,
              Adora1, Cnr1, Grm2, Grm3, Grm4, Grm7, Grm8, Hrh3, Oprd1, Oprk1,
              Sstr1, Sstr2, Sstr3, Npy1r, Npy2r]
    gq_plc_axis:
      category: receptors
      coupling: Gq/11
      description: M-current/SK suppression, dendritic facilitation
      genes: [Chrm1, Chrm3, Chrm5, Adra1a, Adra1b, Htr2a, Grm1, Grm5, Hrh1,
              Crhr1, Cckbr]
    gs_camp_hcn_axis:
      category: receptors
      coupling: Gs
      description: ↑cAMP → HCN rightward shift, Cav facilitation
      genes: [Adrb1, Drd1, Drd5, Adora2a, Hrh2, Htr4, Htr6, Htr7, Vipr1, Adcyap1r1]

